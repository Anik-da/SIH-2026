<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Dark Modern Background Circle -->
  <rect width="512" height="512" rx="128" fill="#090d16"/>
  <circle cx="256" cy="256" r="230" stroke="url(#grad1)" stroke-width="6" fill="none" opacity="0.3"/>

  <!-- 3D Isometric Vertical Property Prism (Building Stack) -->
  <g transform="translate(0, 10)" filter="url(#shadow)">
    <!-- Top Floor Face -->
    <polygon points="256,90 380,160 256,230 132,160" fill="url(#grad2)"/>
    
    <!-- Left Wall -->
    <polygon points="132,160 256,230 256,380 132,310" fill="#0284c7" opacity="0.85"/>
    
    <!-- Right Wall -->
    <polygon points="256,230 380,160 380,310 256,380" fill="#0369a1" opacity="0.95"/>
    
    <!-- Horizontal 3D Floor Slice Indicators (Vertical Cadastral Slices) -->
    <line x1="132" y1="210" x2="256" y2="280" stroke="#38bdf8" stroke-width="4" opacity="0.8"/>
    <line x1="256" y1="280" x2="380" y2="210" stroke="#38bdf8" stroke-width="4" opacity="0.8"/>
    
    <line x1="132" y1="260" x2="256" y2="330" stroke="#38bdf8" stroke-width="4" opacity="0.8"/>
    <line x1="256" y1="330" x2="380" y2="260" stroke="#38bdf8" stroke-width="4" opacity="0.8"/>
    
    <!-- Wireframe Edges Highlight -->
    <polyline points="132,160 256,90 380,160 380,310 256,380 132,310 132,160" fill="none" stroke="#67e8f9" stroke-width="6"/>
    <line x1="256" y1="230" x2="256" y2="380" stroke="#67e8f9" stroke-width="6"/>
    
    <!-- Glowing Pin Node (ULPIN Geo-Location Pin) -->
    <circle cx="256" cy="160" r="18" fill="#f43f5e"/>
    <circle cx="256" cy="160" r="8" fill="#ffffff"/>
  </g>
</svg>
